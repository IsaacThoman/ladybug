apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ladybug
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      serviceAccountName: worker
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ladybug-worker
          envFrom:
            - secretRef:
                name: ladybug-secrets
            - configMapRef:
                name: ladybug-config
          env:
            - name: SANDBOX_PROVIDER
              value: k8s
            - name: GATEWAY_HOST
              value: gateway.ladybug.svc.cluster.local
            - name: SANDBOX_IMAGE_PULL_SECRET
              value: registry-pull
            - name: GATEWAY_CA_PEM
              valueFrom:
                secretKeyRef:
                  name: gateway-ca
                  key: ca.crt
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          # No HTTP listener yet. Readiness verifies queue access, liveness PID 1.
          readinessProbe:
            exec:
              command:
                - node
                - --input-type=module
                - -e
                - >-
                  import { createRedis } from '@ladybug/backend';
                  const redis = createRedis();
                  try { if (await redis.ping() !== 'PONG') process.exitCode = 1; }
                  finally { redis.disconnect(); }
            timeoutSeconds: 5
            periodSeconds: 15
          livenessProbe:
            exec:
              command: [node, -e, "process.kill(1, 0)"]
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 30
