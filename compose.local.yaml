# Local use: publishes ports on 127.0.0.1. Deployments use compose.yaml alone.
#
#   cp .env.example .env
#   docker compose -f compose.yaml -f compose.local.yaml up --build
#
# Or only the data services, to run the server and worker on the host:
#
#   npm run services:up

name: ladybug

services:
  web:
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"

  server:
    ports:
      - "127.0.0.1:${SERVER_PORT:-3001}:3001"

  typesense:
    ports:
      - "127.0.0.1:${TYPESENSE_PORT:-8108}:8108"

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  valkey:
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
