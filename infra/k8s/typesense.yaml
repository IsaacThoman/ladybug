# Typesense: the URL verdict store and activity log the server searches.
apiVersion: v1
kind: Service
metadata:
  name: typesense
  namespace: ladybug
spec:
  selector:
    app.kubernetes.io/name: typesense
  ports:
    - name: http
      port: 8108
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: typesense
  namespace: ladybug
spec:
  serviceName: typesense
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: typesense
  template:
    metadata:
      labels:
        app.kubernetes.io/name: typesense
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        pool: system
      containers:
        - name: typesense
          image: typesense/typesense:30.2
          args:
            - --data-dir=/data
            - --api-key=$(TYPESENSE_API_KEY)
          env:
            - name: TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ladybug-secrets
                  key: TYPESENSE_API_KEY
          ports:
            - name: http
              containerPort: 8108
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # VKE's default class is Vultr Block Storage, whose smallest volume is 10Gi (NVMe) / 40Gi (HDD).
        resources:
          requests:
            storage: 40Gi
