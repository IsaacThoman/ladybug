<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Computerbug warning</title>
  </head>
  <body>
    <main
      class="blocked"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="title"
      aria-describedby="summary"
      tabindex="-1"
      hidden
    >
      <h1 id="title">Blocked</h1>
      <p id="summary" class="summary">
        Computerbug blocked <strong id="host"></strong> because it looks dangerous.
      </p>

      <!-- A desktop ladybug is listening: it has the details and the options. -->
      <section id="handoff" class="handoff" aria-live="polite" hidden>
        <p>Your ladybug has the details and your options. Look for it on your screen.</p>
        <button id="show-here" type="button" class="link-button">Show them here instead</button>
      </section>

      <!-- Otherwise the options are here. -->
      <section id="here" class="actions" hidden>
        <button id="exit" type="button" class="button primary">Get me out of here</button>
        <button id="continue" type="button" class="button ghost">Continue anyway</button>
      </section>
    </main>

    <script type="module" src="./src/warningPage.ts"></script>
  </body>
</html>
