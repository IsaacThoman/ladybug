# Backend stack: Typesense (URL verdicts + activity log), Postgres (scans),
# Valkey (scan queue + live events) and the Node server, which also serves the
# admin UI at http://localhost:3001/admin/.
#
#   docker compose up --build
#
# The scan worker runs on the host (`npm run dev:worker`), because it starts
# sandbox containers on your local Docker. Without it, set ANALYZER=placeholder.
# `npm run services:up` starts only the data services, for running the server
# on the host too.
#
# Override any of the ${...} values with a .env file next to this one.

name: ladybug

services:
  typesense:
    image: typesense/typesense:30.2
    restart: unless-stopped
    command:
      - --data-dir=/data
      - --api-key=${TYPESENSE_API_KEY:-ladybug-dev-key}
      - --enable-cors
    ports:
      - "127.0.0.1:${TYPESENSE_PORT:-8108}:8108"
    volumes:
      - typesense-data:/data
    healthcheck:
      # The image has no curl/wget, so speak HTTP over bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8108 &&
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"ok":true' <&3
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ladybug
      POSTGRES_PASSWORD: ladybug
      POSTGRES_DB: ladybug
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ladybug"]
      interval: 2s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      retries: 30

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-ladybug-dev-key}
      ANALYSIS_DELAY_MS: ${ANALYSIS_DELAY_MS:-30000}
      ANALYZER: ${ANALYZER:-scan}
      DATABASE_URL: postgres://ladybug:ladybug@postgres:5432/ladybug
      REDIS_URL: redis://valkey:6379
      # Shared with a worker on the host through the bind mount below.
      ARTIFACT_DIR: /app/.artifacts
      API_KEYS: ${API_KEYS:-}
    ports:
      # Localhost only by default: nothing is authenticated yet. Set
      # SERVER_BIND=0.0.0.0 to expose it.
      - "${SERVER_BIND:-127.0.0.1}:${SERVER_PORT:-3001}:3001"
    volumes:
      - ./.artifacts:/app/.artifacts
    depends_on:
      typesense:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

volumes:
  typesense-data:
  postgres-data:
