apiVersion: v1
kind: ConfigMap
metadata:
  name: ladybug-config
  namespace: ladybug
data:
  ARTIFACT_STORE: s3
  # Replaced by bootstrap.sh from Terraform outputs.
  S3_BUCKET: REPLACE_FROM_TERRAFORM
  S3_ENDPOINT: https://REPLACE_FROM_TERRAFORM
  S3_REGION: us-east-1
  DATABASE_SSL: "true"
  SANDBOX_NAMESPACE: sandbox
  SANDBOX_IMAGE: ladybug-sandbox
  WORKER_CONCURRENCY: "10"
  # OpenAI-compatible endpoint; bootstrap.sh fills these from LLM_BASE_URL / LLM_MODEL.
  LLM_BASE_URL: https://api.openai.com/v1
  LLM_MODEL: ""
  LLM_VISION: "true"
