apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: ladybug
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: worker-sandboxes
  namespace: sandbox
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: worker-sandboxes
  namespace: sandbox
subjects:
  - kind: ServiceAccount
    name: worker
    namespace: ladybug
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: worker-sandboxes
