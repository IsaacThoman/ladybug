name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The full deployment, plus the accounts a sandboxes-only cluster adds.
      - run: (kubectl kustomize infra/k8s; echo ---; cat infra/k8s/remote-worker.yaml) > rendered.yaml
      - run: docker run --rm -i ghcr.io/yannh/kubeconform:latest -strict -summary - < rendered.yaml
      - name: Compose stack
        run: |
          docker compose --env-file .env.example -f compose.yaml config -q
          docker compose --env-file .env.example -f compose.yaml -f compose.local.yaml config -q
